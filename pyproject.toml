[project]
name = "python-ai-chat-portfolio"
version = "0.1.0"
description = "Python-AI-Chat-Portfolio: 自己紹介ページ + Gemini関数呼び出しエージェントのAIチャット"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.162.0",
    "google-genai>=2.33.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "uvicorn>=0.54.0",
]

[tool.vercel]
entrypoint = "app.main:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
